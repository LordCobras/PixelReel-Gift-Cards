name: Build PixelReel Gift Cards v0.4 Sidebar Fix
on:
  push:
    paths:
      - 'development/v04/**'
      - '.github/workflows/build-giftcard-v04.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenCart installer
        run: python3 development/v04/build.py
      - name: Check installer contents and namespace
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path('releases/pixelgift_clean.ocmod.zip')
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'ocmod/pixelgift_clean_sidebar.ocmod.xml' in z.namelist()
              assert 'admin/controller/module/giftcard.php' in z.namelist()
          PY
      - name: Commit built ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/pixelgift_clean.ocmod.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish v0.4 development ZIP with sidebar fix"
            git push
          fi
