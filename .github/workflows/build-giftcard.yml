name: Build PixelReel Gift Cards Development ZIP
on:
  push:
    paths:
      - 'development/v03/**'
      - '.github/workflows/build-giftcard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build OCMOD installer
        run: python3 development/v03/build.py
      - name: Commit development installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/pixelgift_clean.ocmod.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build v0.3 development installer with sidebar"
            git push
          fi
